backend:
  name: github
  repo: balikaschool/balikaschool.github.io
  branch: main
  auth_methods: [token]
  base_url: https://sharadabalika.edu.np

media_folder: "src/assets/uploads"
public_folder: "/src/assets/uploads"

logo:
  src: https://sharadabalika.edu.np/admin/balika.png
  show_in_header: true

app_title: Balika School CMS

collections:
  - name: notices
    label: "Notices"
    label_singular: "Notice"
    identifier_field: title
    folder: "src/content/notices"
    media_folder: "/src/assets/notices"
    public_folder: "../../assets/notices"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Title", widget: string }
      - {
          name: category,
          label: "Category",
          widget: select,
          options: ["Admission", "Examination", "Holiday", "Event", "General", "Talent"],
        }
      - { name: date, label: "Date", widget: datetime }
      - { name: photo, label: "Main photo", widget: image, required: false }
      - {
          name: gallery,
          label: "More photos",
          widget: list,
          required: false,
          field: { name: image, label: "Photo", widget: image },
        }
      - {
          name: featured,
          label: "Feature on homepage",
          widget: boolean,
          default: false,
          required: false,
        }
      - {
          name: pinned,
          label: "Pin Notice",
          widget: boolean,
          default: false,
          required: false,
        }
      - {
          name: body,
          label: "Notice Content",
          widget: markdown,
          required: false,
        }
      - name: attachments
        label: "Attachments"
        label_singular: "Attachment"
        widget: list
        required: false
        hint: "Upload files (PDF, Word, ZIP, etc.) that visitors can download"
        fields:
          - name: label
            label: "Display label"
            widget: string
            required: false
            hint: "Readable name shown on the page, e.g. Result Sheet PDF"
          - name: file
            label: "File"
            widget: file
            media_folder: "/public/uploads"
            public_folder: "/uploads"
            hint: "Upload any file type: PDF, DOCX, XLSX, ZIP, etc."

  - name: teachers
    label: "Teachers"
    label_singular: "Teacher"
    identifier_field: name
    folder: "src/content/teachers"
    media_folder: "/src/assets/teachers"
    public_folder: "../../assets/teachers"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: name, label: "Name", widget: string }
      - {
          name: designation,
          label: "Designation",
          widget: string,
          hint: "e.g. Principal, Mathematics Teacher",
        }
      - { name: photo, label: "Photo", widget: image }
      - {
          name: subject,
          label: "Subject taught",
          widget: string,
          required: false,
        }
      - {
          name: phone,
          label: "Phone Number",
          widget: string,
          required: false,
          hint: "Optional contact number",
        }
      - {
          name: address,
          label: "Address",
          widget: string,
          required: false,
          hint: "Optional address / location",
        }
      - {
          name: dob,
          label: "Date of Birth",
          widget: string,
          required: false,
          hint: "Optional date of birth (e.g. YYYY-MM-DD)",
        }
      - {
          name: bloodGroup,
          label: "Blood Group",
          widget: string,
          required: false,
          hint: "Optional blood group (e.g. A+, B+, O+)",
        }
      - {
          name: arrived,
          label: "Joined Date",
          widget: datetime,
          required: false,
        }
      - {
          name: memorial,
          label: "In Memoriam / Retired",
          widget: boolean,
          default: false,
          required: false,
          hint: "For past/late teachers and founders",
        }
      - {
          name: order,
          label: "Order of display",
          widget: number,
          default: 0,
          required: false,
        }

  - name: highlights
    label: "Highlights"
    label_singular: "Highlight"
    identifier_field: title
    folder: "src/content/highlights"
    media_folder: "/src/assets/highlights"
    public_folder: "../../assets/highlights"
    create: true
    slug: "{{slug}}"
    fields:
      - {
          name: title,
          label: "Caption",
          widget: string,
          hint: "A few words — also read aloud by screen readers",
        }
      - { name: photo, label: "Photo", widget: image }
      - {
          name: link,
          label: "Post link",
          widget: string,
          required: false,
          hint: "Optional external/social link for this highlight",
        }
      - {
          name: order,
          label: "Order",
          widget: number,
          default: 0,
          required: false,
        }

  - name: about
    label: "About"
    label_singular: "About Section"
    identifier_field: title_ne
    folder: "src/content/about"
    media_folder: "/src/assets/about"
    public_folder: "../../assets/about"
    create: true
    slug: "{{slug}}"
    fields:
      - {
          name: title_ne,
          label: "Title (Nepali) *",
          widget: string,
          hint: "नेपाली शीर्षक",
        }
      - {
          name: order,
          label: "Display Order",
          widget: number,
          default: 0,
          required: false,
          hint: "क्रमानुसार प्रदर्शन गर्न (१, २, ३...)",
        }
      - {
          name: photo,
          label: "Section Photo",
          widget: image,
          required: false,
          hint: "Optional photo for this section",
        }
      - {
          name: caption_ne,
          label: "Photo Caption (Nepali)",
          widget: string,
          required: false,
          hint: "तस्बिरको क्याप्सन",
        }
      - {
          name: enable_en,
          label: "Enable English Translation",
          widget: boolean,
          default: false,
          required: false,
          hint: "Turn ON to enable English version. If OFF, Nepali will be shown even if user switches to English on website.",
        }
      - {
          name: title_en,
          label: "Title (English)",
          widget: string,
          required: false,
          hint: "Optional English title",
        }
      - {
          name: caption_en,
          label: "Photo Caption (English)",
          widget: string,
          required: false,
          hint: "Optional English photo caption",
        }
      - {
          name: body,
          label: "Content (Nepali) *",
          widget: markdown,
          hint: "नेपाली विवरण (Markdown)",
        }
      - {
          name: body_en,
          label: "Content (English)",
          widget: markdown,
          required: false,
          hint: "Optional English content (Markdown)",
        }

  - name: settings
    label: "Settings"
    files:
      - name: site_info
        label: "General"
        file: "src/content/settings/site.json"
        format: "json"
        fields:
          - { name: name_ne, label: "School Name (Nepali)", widget: string }
          - { name: name_en, label: "School Name (English)", widget: string }
          - { name: header_main_ne, label: "Header Main Name (Nepali)", widget: string, hint: "e.g. श्री शारदा बालिका नमुना" }
          - { name: header_sub_ne, label: "Header Sub Name (Nepali)", widget: string, hint: "e.g. माध्यमिक विद्यालय" }
          - { name: header_main_en, label: "Header Main Name (English)", widget: string, hint: "e.g. Shree Sharada Balika Namuna" }
          - { name: header_sub_en, label: "Header Sub Name (English)", widget: string, hint: "e.g. Secondary School" }
          - { name: tagline_ne, label: "Tagline (Nepali)", widget: string, required: false }
          - { name: tagline_en, label: "Tagline (English)", widget: string, required: false }
          - { name: logo, label: "School Logo", widget: image, required: false, hint: "Main navbar logo" }
          - { name: stampLogo, label: "Stamp Logo", widget: image, required: false, hint: "Footer stamp logo" }
          - { name: email, label: "Email Address", widget: string, hint: "Primary email shown on site" }
          - { name: phones, label: "Phone Numbers", widget: list, field: { name: phone, label: "Phone Number", widget: string } }
          - { name: location_ne, label: "Location (Nepali)", widget: string }
          - { name: location_en, label: "Location (English)", widget: string }
          - { name: estYear, label: "Established Year", widget: string }
          - name: mapEmbed
            label: "Map Embed URL"
            widget: string
            required: false
            hint: "Get this from Google Maps → Share → Embed a map → copy only the src=\"...\" URL (starts with https://www.google.com/maps/embed?pb=...)"
          - name: mapUrl
            label: "Map Share Link"
            widget: string
            required: false
            hint: "Short share link shown as 'Location Map' in footer & contact page (e.g. https://maps.app.goo.gl/...)"
          - name: socials
            label: "Social Media Links"
            label_singular: "Social Link"
            widget: list
            hint: "Add any social media or link. Choose the platform and paste the URL."
            fields:
              - name: platform
                label: "Platform"
                widget: string
                hint: "e.g. Facebook, Instagram, YouTube, WhatsApp, Map…"
              - { name: url, label: "URL", widget: string, hint: "Full link including https://" }
          - name: theme
            label: "Color Theme (Hex Code)"
            widget: object
            fields:
              - { name: bg, label: "Page Background Color", widget: string, default: "#FAF7F2", hint: "e.g. #FAF7F2" }
              - { name: dark, label: "Dark / Text Color", widget: string, default: "#1E2E2D", hint: "e.g. #1E2E2D" }
              - { name: primary, label: "Primary Button / CTA Color", widget: string, default: "#00706E", hint: "e.g. #00706E" }
              - { name: secondary, label: "Secondary Button Color", widget: string, default: "#A23B24", hint: "e.g. #A23B24" }
              - { name: accent, label: "Accent / Badge Color", widget: string, default: "#00A3A0", hint: "e.g. #00A3A0" }

      - name: homepage
        label: "Homepage Content"
        file: "src/content/settings/homepage.json"
        format: "json"
        fields:
          - { name: heroHeadline_ne, label: "Hero Headline (Nepali)", widget: string }
          - { name: heroHeadline_en, label: "Hero Headline (English)", widget: string, required: false }
          - { name: heroSub_ne, label: "Hero Subtitle (Nepali)", widget: text }
          - { name: heroSub_en, label: "Hero Subtitle (English)", widget: text, required: false }
          - { name: youtubeStoryVideoId, label: "YouTube Video ID", widget: string, hint: "e.g. 20NugF8viUM", required: false }
          - { name: programsHeading_ne, label: "Programs Heading (Nepali)", widget: string, default: "उपलब्ध शैक्षिक कार्यक्रमहरू" }
          - { name: programsHeading_en, label: "Programs Heading (English)", widget: string, default: "Academic Programs Offered", required: false }
          - name: programs
            label: "Academic Programs"
            widget: list
            fields:
              - { name: title_ne, label: "Title (Nepali)", widget: string }
              - { name: title_en, label: "Title (English)", widget: string, required: false }
              - { name: level_ne, label: "Level (Nepali)", widget: string, required: false }
              - { name: level_en, label: "Level (English)", widget: string, required: false }
              - { name: desc_ne, label: "Description (Nepali)", widget: text }
              - { name: desc_en, label: "Description (English)", widget: text, required: false }
              - { name: tags_ne, label: "Tags (Nepali)", widget: string, required: false }
              - { name: tags_en, label: "Tags (English)", widget: string, required: false }


